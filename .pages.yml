{
  "media": {
    "input": "public/uploads",
    "output": "/uploads"
  },
  "content": [
    {
      "name": "site",
      "label": "Site settings",
      "type": "file",
      "path": "src/data/site.json",
      "format": "json",
      "fields": [
        {
          "name": "title",
          "label": "Title",
          "type": "string"
        },
        {
          "name": "councilName",
          "label": "Councilname",
          "type": "string"
        },
        {
          "name": "headline",
          "label": "Headline",
          "type": "string"
        },
        {
          "name": "introduction",
          "label": "Introduction",
          "type": "text"
        },
        {
          "name": "schoolUrl",
          "label": "School url",
          "type": "string"
        },
        {
          "name": "instagramUrl",
          "label": "Instagram url",
          "type": "string"
        },
        {
          "name": "seoTitle",
          "label": "Seo title",
          "type": "string"
        },
        {
          "name": "seoDescription",
          "label": "Seo description",
          "type": "text"
        }
      ]
    },
    {
      "name": "project-play",
      "label": "Project Play",
      "type": "file",
      "path": "src/data/project-play.json",
      "format": "json",
      "fields": [
        {
          "name": "title",
          "label": "Title",
          "type": "string"
        },
        {
          "name": "story",
          "label": "Story",
          "type": "text"
        },
        {
          "name": "goal",
          "label": "Fundraising goal (CAD)",
          "type": "number",
          "description": "Leave empty until confirmed. Enter a non-negative CAD amount."
        },
        {
          "name": "raised",
          "label": "Amount raised (CAD)",
          "type": "number",
          "description": "Leave empty until confirmed. Enter a non-negative CAD amount."
        },
        {
          "name": "lastUpdated",
          "label": "Lastupdated",
          "type": "date",
          "options": {
            "format": "yyyy-MM-dd"
          }
        },
        {
          "name": "ctaLabel",
          "label": "Ctalabel",
          "type": "string"
        },
        {
          "name": "ctaUrl",
          "label": "Approved donation URL",
          "type": "string"
        },
        {
          "name": "showProgress",
          "label": "Show confirmed fundraising progress",
          "type": "boolean"
        },
        {
          "name": "seoTitle",
          "label": "Seo title",
          "type": "string"
        },
        {
          "name": "seoDescription",
          "label": "Seo description",
          "type": "text"
        }
      ]
    },
    {
      "name": "events",
      "label": "Project Play events",
      "type": "collection",
      "path": "src/content/events",
      "format": "json",
      "filename": "{primary}.json",
      "view": {
        "primary": "title"
      },
      "fields": [
        {
          "name": "title",
          "label": "Title",
          "type": "string"
        },
        {
          "name": "description",
          "label": "Description",
          "type": "rich-text",
          "description": "Use the toolbar for bold, italic, lists and links.",
          "options": {
            "format": "markdown",
            "media": false
          }
        },
        {
          "name": "start",
          "label": "Start",
          "type": "date",
          "options": {
            "time": true,
            "format": "yyyy-MM-dd'T'HH:mm:ssXXX"
          }
        },
        {
          "name": "end",
          "label": "End",
          "type": "date",
          "options": {
            "time": true,
            "format": "yyyy-MM-dd'T'HH:mm:ssXXX"
          }
        },
        {
          "name": "location",
          "label": "Location",
          "type": "string"
        },
        {
          "name": "url",
          "label": "Link URL",
          "type": "string"
        },
        {
          "name": "visible",
          "label": "Visible",
          "type": "boolean"
        },
        {
          "name": "status",
          "label": "Event status",
          "type": "select",
          "options": {
            "values": [
              "Upcoming",
              "Running",
              "Completed"
            ]
          }
        },
        {
          "name": "ctaLabel",
          "label": "Button text",
          "type": "string"
        },
        {
          "name": "order",
          "label": "Order for undated events",
          "type": "number"
        }
      ]
    },
    {
      "name": "home-page-cards",
      "label": "Home page cards",
      "type": "collection",
      "path": "src/content/home-page-cards",
      "format": "json",
      "filename": "{primary}.json",
      "view": {
        "primary": "title",
        "sort": "order",
        "order": "asc"
      },
      "fields": [
        {
          "name": "title",
          "label": "Title",
          "type": "string",
          "required": true
        },
        {
          "name": "eyebrow",
          "label": "Small label above title",
          "type": "string"
        },
        {
          "name": "description",
          "label": "Short description",
          "type": "text"
        },
        {
          "name": "url",
          "label": "Link",
          "type": "string",
          "required": true,
          "description": "Use /project-play/ for a page on this site, or a full https:// link."
        },
        {
          "name": "icon",
          "label": "Icon",
          "type": "select",
          "options": {
            "values": [
              "Playground",
              "Calendar",
              "Heart",
              "Community"
            ]
          }
        },
        {
          "name": "image",
          "label": "Custom image (optional)",
          "type": "image",
          "description": "Replaces the icon when provided."
        },
        {
          "name": "imageAlt",
          "label": "Image description",
          "type": "string"
        },
        {
          "name": "order",
          "label": "Display order",
          "type": "number",
          "description": "Lower numbers appear first."
        },
        {
          "name": "visible",
          "label": "Show on homepage",
          "type": "boolean"
        }
      ]
    }
  ]
}
